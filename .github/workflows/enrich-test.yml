name: Fyucha Player Database Enrichment

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Player database JSON filename/path"
        required: true
        default: "players.json"
        type: string

      limit:
        description: "Number of players to process (0 = all)"
        required: true
        default: "100"
        type: string

      resume:
        description: "Resume from checkpoint"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  enrichment:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # SHOW REPOSITORY CONTENTS
      # ======================================================

      - name: Inspect repository
        run: |
          echo "=============================================="
          echo "REPOSITORY CONTENTS"
          echo "=============================================="

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=============================================="
          echo "JSON FILES"
          echo "=============================================="

          find . -type f -name "*.json" | sort

      # ======================================================
      # CHECK PYTHON SCRIPT
      # ======================================================

      - name: Check enrichment script
        run: |
          if [ ! -f enrich_players.py ]; then
            echo "ERROR: enrich_players.py was not found."
            exit 1
          fi

          python -m py_compile enrich_players.py

          echo "Python syntax check passed."

      # ======================================================
      # FIND INPUT DATABASE
      # ======================================================

      - name: Locate player database
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |

          echo "Requested input:"
          echo "${INPUT_FILE}"

          if [ -f "${INPUT_FILE}" ]; then

            echo "Found input database:"
            echo "${INPUT_FILE}"

          else

            echo ""
            echo "Requested file was not found."
            echo ""
            echo "Available JSON files:"
            find . -type f -name "*.json" | sort

            echo ""

            echo "If your player database has a different"
            echo "filename, enter that path in the"
            echo "'input_file' field when running the workflow."

            exit 1

          fi

      # ======================================================
      # CHECK DATABASE
      # ======================================================

      - name: Validate player database
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |

          python - <<'PY'
          import json
          import os

          path = os.environ["INPUT_FILE"]

          print("Reading:", path)

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if isinstance(data, list):

              players = data

          elif isinstance(data, dict):

              players = data.get(
                  "players",
                  []
              )

          else:

              raise SystemExit(
                  "ERROR: Unsupported JSON structure."
              )

          print(
              f"Players found: {len(players):,}"
          )

          if not players:

              raise SystemExit(
                  "ERROR: Player database is empty."
              )

          print(
              "Player database validation passed."
          )
          PY

      # ======================================================
      # RUN ENRICHMENT
      # ======================================================

      - name: Run enrichment
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          PLAYER_LIMIT: ${{ inputs.limit }}
          RESUME_RUN: ${{ inputs.resume }}
        run: |

          echo "=============================================="
          echo "STARTING FYUCHA ENRICHMENT"
          echo "=============================================="

          echo "Input: ${INPUT_FILE}"
          echo "Limit: ${PLAYER_LIMIT}"
          echo "Resume: ${RESUME_RUN}"

          if [ "${RESUME_RUN}" = "true" ]; then

            python enrich_players.py \
              --input "${INPUT_FILE}" \
              --output enriched_players.json \
              --checkpoint enrichment_checkpoint.json \
              --diagnostics enrichment_diagnostics.csv \
              --limit "${PLAYER_LIMIT}" \
              --resume

          else

            python enrich_players.py \
              --input "${INPUT_FILE}" \
              --output enriched_players.json \
              --checkpoint enrichment_checkpoint.json \
              --diagnostics enrichment_diagnostics.csv \
              --limit "${PLAYER_LIMIT}" \
              --fresh

          fi

      # ======================================================
      # VERIFY OUTPUT
      # ======================================================

      - name: Verify output
        run: |

          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          ls -lah

          if [ ! -f enriched_players.json ]; then
            echo "ERROR: enriched_players.json was not created."
            exit 1
          fi

          if [ ! -f enrichment_diagnostics.csv ]; then
            echo "ERROR: diagnostics file was not created."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "enriched_players.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if isinstance(data, list):

              players = data

          elif isinstance(data, dict):

              players = data.get(
                  "players",
                  []
              )

          else:

              raise SystemExit(
                  "Invalid output JSON."
              )

          print(
              f"Output records: {len(players):,}"
          )

          if not players:

              raise SystemExit(
                  "Output database is empty."
              )

          print(
              "Output validation passed."
          )
          PY

      # ======================================================
      # UPLOAD RESULTS
      # ======================================================

      - name: Upload enrichment results
        uses: actions/upload-artifact@v4
        with:
          name: fyucha-enrichment-results
          path: |
            enriched_players.json
            enrichment_diagnostics.csv
            enrichment_checkpoint.json
          retention-days: 30
