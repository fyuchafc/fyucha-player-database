name: Test Wikidata Enrichment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Wikidata enrichment test
        run: python enrich_players.py

      - name: Save enrichment test results
        run: |
          git config user.name "Fyucha Database Bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/enriched-players-test.json
          git add output/wikidata-matches-test.json
          git add output/dob-corrections-test.json
          git add output/year-only-test.json
          git diff --cached --quiet || git commit -m "Run Wikidata enrichment V2.1 test"
          git push
